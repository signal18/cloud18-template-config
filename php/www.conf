; Cloud18 sample PHP application: PHP-FPM pool of the signal18/php-fpm-84 image,
; mounted on /etc/php/8.4/fpm/pool.d/www.conf by the php template.
; clear_env = no: the variables of the app (DB_HOST, DB_USER, ...) reach PHP.
[www]
user  = www-data
group = www-data
listen       = /var/run/php-fpm.sock
listen.owner = www-data
listen.group = www-data
pm                   = dynamic
pm.max_children      = 10
pm.start_servers     = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests      = 500
catch_workers_output = yes
clear_env = no
